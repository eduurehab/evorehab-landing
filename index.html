<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EVOREHAB | Readaptación online de rodilla</title>

  <meta
    name="description"
    content="EVOREHAB es un programa online de readaptación de rodilla para deportistas lesionados que quieren volver a entrenar con seguridad."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="home-page">
    <section class="home-card">
      <img
        class="home-logo"
        src="assets/logo-evorehab.png"
        alt="Logo EVOREHAB"
      />

      <div class="home-copy">
        <h1 class="home-title">
          Programa <span class="title-evo">EVO</span><span class="title-rehab">REHAB</span>
        </h1>

        <p class="home-subtitle">
          Evoluciona tu rodilla al siguiente nivel
        </p>
      </div>

      <div class="home-buttons">
        <a
          class="home-button home-button-calendar"
          href="https://calendar.app.google/DQrk87xMseofSLfK6"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/calendar.png" alt="" class="button-icon" />
          <span>Agenda una reunión conmigo</span>
        </a>

        <a
          class="home-button home-button-whatsapp"
          href="https://wa.me/34644516082?text=Hola%20Edu%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20tu%20programa%20de%20readaptaci%C3%B3n%20de%20rodilla"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/whatsapp.png" alt="" class="button-icon" />
          <span>Pídeme información / Contáctame</span>
        </a>

        <a
          class="home-button home-button-instagram"
          href="https://www.instagram.com/edu.rehab"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/instagram.png" alt="" class="button-icon" />
          <span>Sígueme en Instagram</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
